[package]
name = "coc-phoenix-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
description = "Character signup backend for the CoC Phoenix tracker (answers-as-inputs, deterministic sheet projection)."
# Without this, `cargo run` is ambiguous (two [[bin]] targets) and the documented quick start fails.
default-run = "coc-phoenix-backend"

[lib]
name = "coc_phoenix"
path = "src/lib.rs"

[[bin]]
name = "coc-phoenix-backend"
path = "src/main.rs"

[[bin]]
name = "gen-seed"
path = "src/bin/gen_seed.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
sqlx = { version = "0.7", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Drives the router in-process (no socket, no database) so extractor rejections can be asserted.
tower = { version = "0.4", features = ["util"] }
