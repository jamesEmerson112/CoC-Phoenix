<style>
/* Layout: one phone-width column (max 480px), sticky step header, fixed bottom action bar.
   A single committed dark look: the spec's "3 a.m. group chat crossed with a public-records office". */
:root {
  color-scheme: dark;
  --bg: #0f141b;
  --panel: #171e28;
  --panel-2: #1f2834;
  --line: #2c3746;
  --fg: #e7ecf1;
  --muted: #95a2b3;
  --faint: #5f6c7d;
  --accent: #5cc0c9;
  --accent-ink: #062126;
  --amber: #e7ad4f;
  --amber-ink: #2a1a02;
  --rose: #e08cb4;
  --danger: #f08a7a;
  --bar-base: #4b596b;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; }
h2 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.015em; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
.mono { font-family: var(--f-mono); }
.muted { color: var(--muted); }
.tnum { font-variant-numeric: tabular-nums; }

.app { max-width: 480px; margin: 0 auto; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 10px; border-bottom: 1px solid var(--line);

}
.top-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.files-btn { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 0.78rem; color: var(--muted); font-family: var(--f-mono); }
.progress { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.progress button { height: 22px; background: none; border: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
.progress i { display: block; height: 3px; border-radius: 2px; background: var(--line); }
.progress span { font-family: var(--f-mono); font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress .done i { background: var(--accent); opacity: 0.55; }

.vitals b { color: var(--fg); font-weight: 500; }

main {

.bar {

.bar-in { max-width: 448px; margin: 0 auto; display: flex; gap: 10px; }

.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); flex: 1; }

.btn.ghost { background: none; }
.btn.wide { width: 100%; }

.choices { display: flex; flex-direction: column; gap: 10px; }

.tag.fit { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.toggles { display: flex; flex-wrap: wrap; gap: 8px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 0.84rem; color: var(--muted); }
.toggle[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); }
.toggle i { width: 26px; height: 15px; border-radius: 999px; background: var(--line); position: relative; flex: none; }
.toggle i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.toggle[aria-pressed="true"] i { background: var(--accent); }
.toggle[aria-pressed="true"] i::after { transform: translateX(11px); background: var(--accent-ink); }

.phases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.phase { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px; font-size: 0.8rem; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 1px; }
.phase b { font-family: var(--f-mono); font-size: 0.68rem; font-weight: 500; color: var(--faint); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.stat small { font-family: var(--f-mono); font-size: 0.68rem; letter-spacing: 0.08em; color: var(--muted); }
.stat b { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .faces { font-family: var(--f-mono); font-size: 0.66rem; color: var(--faint); letter-spacing: 0.04em; }

.pts { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); white-space: nowrap; text-align: right; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.picks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.pick { border: 1px dashed var(--line); border-radius: 10px; padding: 8px 6px; min-height: 58px; display: flex; flex-direction: column; gap: 2px; background: none; text-align: left; min-width: 0; }
.pick.full { border-style: solid; border-color: var(--amber); background: color-mix(in srgb, var(--amber) 8%, var(--panel)); }
.pick small { font-family: var(--f-mono); font-size: 0.62rem; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; }
.pick span { font-size: 0.8rem; line-height: 1.25; overflow-wrap: anywhere; }
.hobbies { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.hobby { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 4px; position: relative; min-width: 0; }
.hobby[aria-pressed="true"] { border-color: var(--amber); }
.hobby:disabled { opacity: 0.45; cursor: not-allowed; }
.hobby b { font-family: var(--f-display); font-size: 0.98rem; padding-right: 22px; }
.hobby .blurb { font-size: 0.8rem; color: var(--muted); }

.sheet-id { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }

.stamp { position: absolute; top: 14px; right: 12px; font-family: var(--f-mono); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; border: 1.5px solid currentColor; border-radius: 4px; padding: 3px 7px; transform: rotate(4deg); }

.block { display: flex; flex-direction: column; gap: 10px; }
.block > h3 { font-size: 0.74rem; font-family: var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.derived { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.dv { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 0; min-width: 0; }

.cr .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }

  background: var(--panel-2); border: 1px solid var(--danger); border-radius: 12px; padding: 12px 14px; font-size: 0.9rem;

<script>

const DICE_3D6 = ["str", "con", "dex", "app", "pow"];
const BANDS = [
  { id: "young", name: "Young", ages: "15–19", age: 17, copy: "The universe protects the young.", fx: "No EDU checks · EDU −5 · −5 split across STR and SIZ · Luck rolled twice, keep the better" },

  { id: "venerable", name: "Venerable", ages: "60–89", age: 65, copy: "Four chances at wisdom; the body pays for all of them.", fx: "4 EDU checks · physicals −20 / −40 / −80 · APP −15 / −20 / −25 · MOV −3 / −4 / −5" },
];
const KEY_DRAFT = "phoenix.draft.v1", KEY_FILES = "phoenix.files.v1", KEY_FAST = "phoenix.fast.v1";

/* ---------- the rules engine: the backend's Rust modules compiled to WebAssembly ---------- */
let wasm;
const enc = new TextEncoder(), dec = new TextDecoder();
function api(req) {
  const b = enc.encode(JSON.stringify(req));
  const p = wasm.mem_alloc(b.length);
  new Uint8Array(wasm.memory.buffer, p, b.length).set(b);
  const n = wasm.call(p, b.length);
  wasm.mem_free(p, b.length);
  return JSON.parse(dec.decode(new Uint8Array(wasm.memory.buffer, wasm.out_ptr(), n)));
}

/* ---------- storage (this device only) ---------- */
function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* ---------- state ---------- */
const S = { rec: null, step: 0, phase: "chars", manual: false, fast: load(KEY_FAST, false), view: "wizard", openCareer: null, allSkills: false, confirmSeal: false, anim: null, files: load(KEY_FILES, []) };

function uuid() { try { return crypto.randomUUID(); } catch (e) { return "x" + Date.now().toString(16) + Math.random().toString(16).slice(2); } }
function newRec() { const now = new Date().toISOString(); return { id: uuid(), ownerId: null, status: "draft", answers: {}, sheet: null, sheetIsSnapshot: false, contentPackId: "starter-modern", createdAt: now, updatedAt: now, finalizedAt: null }; }
function A() { return S.rec.answers; }
function D() { return A().dice || {}; }
function sealed() { return S.rec.status === "finalized"; }
function reproject() { if (!sealed()) S.rec.sheet = api({ op: "project", answers: A() }).ok; }
function save() { if (!sealed()) store(KEY_DRAFT, { rec: S.rec, step: S.step, phase: S.phase }); }

function mutate(op, extra) {
  if (sealed()) { toast("This investigator is sealed. Its answers are frozen."); return false; }
  const r = api(Object.assign({ op, answers: A() }, extra));
  if (r.error) { toast(r.error.message, r.error.details); return false; }
  S.rec.answers = r.ok; S.rec.updatedAt = new Date().toISOString();
  reproject(); save(); return true;
}
const patch = p => mutate("patch", { patch: p });
const roll = request => mutate("roll", { request, seed: Array.from(crypto.getRandomValues(new Uint8Array(32))) });

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function money(n) { return "$" + Number(n).toLocaleString("en-US"); }
let toastTimer;
function toast(msg, details) {
  const t = $("#toast");
  t.innerHTML = esc(msg) + (details && details.length ? "<ul>" + details.map(d => "<li>" + esc(d) + "</li>").join("") + "</ul>" : "");
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 6000);
}
function granted() { const s = S.rec.sheet; return s && s.age ? s.age : null; }
function eduSequence() {
  const d = D(), g = granted();
  if (!d.characteristics || !g) return [];
  let cur = d.characteristics.edu - (g.band === "young" ? 5 : 0);
  return (d.eduChecks || []).map((c, i) => {
    const used = i < g.eduChecksGranted, before = cur, hit = used && c.d100 > cur;
    if (hit) cur = Math.min(99, cur + c.gain);
    return { ...c, used, before, hit, after: cur };
  });
}
function rollDone() {
  const d = D(), g = granted();
  return !!(d.characteristics && g && (d.eduChecks || []).length >= g.eduChecksGranted && d.luck && (d.luck.rolls || []).length === g.luckRollsGranted);
}
function careerDone() {
  const a = A(); if (!a.careerId) return false;
  const c = api({ op: "careers", characteristics: null }).ok.find(x => x.id === a.careerId);
  return !!c && c.choiceSlots.every(s => (a.careerChoices || {})[s.id]);
}
function stepDone(i) {
  const a = A();
  return [!!(a.name && a.name.trim()), !!a.age, rollDone(), careerDone(), (a.hobbyIds || []).length === 4, sealed()][i];
}

function stepSheet() {
  const s = S.rec.sheet, a = A();
  if (!s) return "";
  const rolled = !!D().characteristics;
  const meta = [a.pronouns, s.age && s.age.age ? `age ${s.age.age}` : "", s.career ? s.career.name : ""].filter(Boolean).map(esc).join(" · ");
  const trained = s.skills.filter(k => k.careerPoints + k.personalPoints > 0).sort((x, y) => y.value - x.value);
  const list = S.allSkills ? s.skills : trained;
  const skillRows = list.map(k => {
    const b = k.base, c = Math.max(0, Math.min(k.careerPoints, k.value - b)), h = Math.max(0, k.value - b - c);
    const why = [`base ${k.base}`, k.careerPoints ? `career +${k.careerPoints}` : "", k.personalPoints ? `hobby +${k.personalPoints}` : ""].filter(Boolean).join(" · ");
    return `<div class="skill"><span class="nm">${esc(k.name)}</span><span class="val">${k.value}</span>
      <span class="track" aria-hidden="true"><i class="c-base" style="width:${b}%"></i><i class="c-career" style="width:${c}%"></i><i class="c-hobby" style="width:${h}%"></i></span>
      <span class="hf">${k.half} · ${k.fifth}</span>
      <span class="why">${why}${k.pointsLostToCap ? ` · <span class="cap">capped at 75, ${k.pointsLostToCap} lost</span>` : ""}</span></div>`;
  }).join("");
  const dv = s.derived, cr = s.creditRating;
  const miss = !sealed() && !s.completeness.readyToFinalize ? `<div class="missing"><b>Not ready to sign yet</b><ul>${s.completeness.missing.map(m => `<li>${esc(m)}</li>`).join("")}</ul></div>` : "";
  const seal = S.confirmSeal && !sealed() ? `<div class="seal" id="seal"><h3>Sign the file?</h3>
      <p>Once sealed, this record can't be edited. Your numbers become a fact, and somewhere, something now has your name.</p>
      <div class="btns"><button class="btn" data-act="seal-no">Not yet</button><button class="btn rose" data-act="seal-yes">Seal it</button></div></div>` : "";
  return `<div class="sheet-id"><span class="eyebrow">Step 6 · The Sheet</span><h2>${esc(a.name || "Unnamed investigator")}</h2>
      <span class="line">${meta || "Answers still missing"}</span>
      ${s.career ? `<span class="line" style="font-style:italic">${esc(s.career.blurb)}</span>` : ""}
      <span class="stamp ${sealed() ? "sealed" : "draft"}">${sealed() ? "Sealed " + new Date(S.rec.finalizedAt).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "Draft · live"}</span></div>
    ${miss}${seal}
    ${rolled ? `<section class="block"><h3>Characteristics · value · half · fifth</h3><div class="stats">${s.characteristics.map(c =>
      `<div class="stat"><small>${c.id.toUpperCase()}</small><b>${c.value}</b><span class="hf">${c.half} · ${c.fifth}</span></div>`).join("")}</div></section>
    <section class="block"><h3>Derived</h3><div class="derived">
      <div class="dv"><small>HP</small><b>${dv.hitPoints}</b></div><div class="dv"><small>MP</small><b>${dv.magicPoints}</b></div>
      <div class="dv"><small>Sanity</small><b>${dv.sanity}</b></div><div class="dv luck"><small>Luck</small><b>${D().luck ? dv.luck : "—"}</b></div>
      <div class="dv"><small>Dmg bonus</small><b>${esc(dv.damageBonus)}</b></div><div class="dv"><small>Build</small><b>${dv.build}</b></div>
      <div class="dv"><small>Move</small><b>${dv.moveRate}</b></div><div class="dv"><small>Dodge</small><b>${s.skills.find(k => k.id === "dodge")?.value ?? dv.dodgeBase}</b></div></div></section>` : `<p class="note">Roll your dice and the characteristics, HP, Sanity and the rest appear here.</p>`}
    ${s.career ? `<section class="block"><h3>Money</h3><div class="cr"><div class="row"><h3>${esc(cr.descriptor)}</h3><span class="mono tnum">CR ${cr.value}</span></div>
      <div class="money"><span>Spending level ${money(cr.spendingLevel)}</span><span>Assets ${money(cr.assets)}</span></div></div></section>` : ""}
    <section class="block"><h3>Skills · ${S.allSkills ? "all " + s.skills.length : trained.length + " trained"}</h3>
      <div class="legend"><span><i class="c-base"></i>Base</span><span><i class="c-career"></i>Career</span><span><i class="c-hobby"></i>Hobbies</span></div>
      ${list.length ? `<div class="skills">${skillRows}</div>` : `<p class="note">Pick a career and hobbies to train skills.</p>`}
      <button class="linkish" data-act="allskills">${S.allSkills ? "Show trained skills only" : "Show all " + s.skills.length + " skills"}</button></section>
    <section class="block"><h3>Backstory</h3><p class="note">Fate tables for ideology, a significant person, a place, a possession and a trait arrive with a later content pass.</p></section>
    ${about()}`;
}

function viewFiles() {
  const files = S.files.slice().reverse();
  return `<div class="head"><span class="eyebrow">Case files</span><h2>Your investigators</h2>
    <p class="sub">Sealed files, kept on this device. Tap one to open its sheet.</p></div>
    ${files.length ? `<div class="files">${files.map(f => {
      const d = f.sheet.derived;
      return `<button class="file" data-act="open" data-id="${f.id}"><span class="who"><h3>${esc(f.answers.name)}</h3><span>${esc(f.sheet.career ? f.sheet.career.name : "")} · age ${f.answers.age}</span></span>
        <span class="vit">HP ${d.hitPoints} · SAN ${d.sanity}<br>LUCK ${d.luck}</span></button>`;
    }).join("")}</div>` : `<div class="empty"><h3>No sealed files yet</h3><p>Finish the six steps and sign your first investigator. It will be filed here.</p></div>`}`;
}

/* ---------- render ---------- */
function render() {
  renderTop(); renderBar();
  const m = $("#main");
  m.innerHTML = S.view === "files" ? viewFiles() : [stepIdentity, stepAge, stepRoll, stepCareer, stepHobbies, stepSheet][S.step]();
  if (S.anim === "chars" && !S.fast) tumble();
  S.anim = null;
}
function tumble() {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) return;
  document.querySelectorAll("b.tumble").forEach((el, i) => {
    const final = el.dataset.final, end = performance.now() + 380 + i * 90;
    const tick = () => { if (performance.now() >= end) { el.textContent = final; return; } el.textContent = 5 * (3 + Math.floor(Math.random() * 16)); requestAnimationFrame(tick); };
    tick();
  });
}
function goStep(n) { S.step = Math.max(0, Math.min(STEPS.length - 1, n)); S.confirmSeal = false; if (S.step === 2 && !S.manual) S.phase = S.phase || "chars"; save(); render(); window.scrollTo(0, 0); }

/* ---------- actions ---------- */
function intVal(id) { const el = document.getElementById(id); if (!el || el.value.trim() === "") return null; return parseInt(el.value, 10); }
const ACT = {
  go: e => goStep(+e.dataset.step),
  next: () => {
    if (S.step === 2 && S.phase !== "luck") { S.phase = S.phase === "chars" ? "edu" : "luck"; save(); render(); window.scrollTo(0, 0); return; }
    if (S.step === 1 && !A().age) patch({ ageBand: "prime" });
    if (S.step === 1) S.phase = "chars";
    goStep(S.step + 1);
  },
  back: () => {
    if (S.step === 2 && S.phase !== "chars") { S.phase = S.phase === "luck" ? "edu" : "chars"; save(); render(); return; }
    if (S.step === 3) S.phase = "luck";
    goStep(S.step - 1);
  },
  band: e => { const b = BANDS.find(x => x.id === e.dataset.band); if (patch({ age: b.age })) render(); },
  phase: e => { S.phase = e.dataset.phase; save(); render(); },
  manual: () => { S.manual = !S.manual; render(); },
  fast: () => { S.fast = !S.fast; store(KEY_FAST, S.fast); render(); },
  roll: e => {
    const c = e.dataset.ceremony;
    if (roll({ ceremony: c })) { S.anim = { characteristics: "chars", edu_checks: "edu", luck: "luck" }[c]; render(); }
  },
  declare: e => {
    const w = e.dataset.what, req = { ceremony: "declared" };
    if (w === "chars") {
      const c = {}; for (const k of STAT_ORDER) { const v = intVal("m-" + k); if (v === null) return toast("Fill in all eight characteristics."); c[k] = v; }
      req.characteristics = c;
    }
    if (w === "edu") {
      const n = granted().eduChecksGranted, checks = [];
      for (let i = 0; i < n; i++) { const d = intVal("e-d-" + i), g = intVal("e-g-" + i); if (d === null || g === null) return toast("Fill in every check: the d100 and the d10."); checks.push({ d100: d, gain: g }); }
      req.eduChecks = checks;
    }
    if (w === "luck") {
      const n = granted().luckRollsGranted, rolls = [];
      for (let i = 0; i < n; i++) { const v = intVal("l-" + i); if (v === null) return toast(n === 2 ? "Enter both Luck rolls." : "Enter your Luck roll."); rolls.push(v); }
      req.luck = rolls;
    }
    if (roll(req)) { toast2("Saved. Marked as rolled at home."); render(); }
  },
  career: e => {
    const id = e.dataset.id;
    if (A().careerId === id) { S.openCareer = S.openCareer === id ? null : id; render(); return; }
    if (patch({ careerId: id })) { S.openCareer = id; render(); }
  },
  choice: e => { const ch = Object.assign({}, A().careerChoices || {}, { [e.dataset.slot]: e.dataset.opt }); if (patch({ careerChoices: ch })) render(); },
  hobby: e => {
    const id = e.dataset.id, ids = (A().hobbyIds || []).slice(), i = ids.indexOf(id);
    if (i >= 0) ids.splice(i, 1); else if (ids.length < 4) ids.push(id); else return;
    if (patch({ hobbyIds: ids })) render();
  },
  allskills: () => { S.allSkills = !S.allSkills; render(); },
  "seal-ask": () => { S.confirmSeal = true; render(); const el = $("#seal"); if (el) el.scrollIntoView({ block: "center", behavior: "smooth" }); },
  "seal-no": () => { S.confirmSeal = false; render(); },
  "seal-yes": () => {
    const r = api({ op: "finalize", answers: A() });
    if (r.error) return toast(r.error.message, r.error.details);
    Object.assign(S.rec, { status: "finalized", sheet: r.ok, sheetIsSnapshot: true, finalizedAt: new Date().toISOString() });
    S.files.push(JSON.parse(JSON.stringify(S.rec))); store(KEY_FILES, S.files);
    try { localStorage.removeItem(KEY_DRAFT); } catch (e) {}
    S.confirmSeal = false; render(); window.scrollTo(0, 0);
  },
  files: () => { S.view = S.view === "files" ? "wizard" : "files"; render(); window.scrollTo(0, 0); },
  open: e => { const f = S.files.find(x => x.id === e.dataset.id); if (!f) return; S.rec = JSON.parse(JSON.stringify(f)); S.view = "wizard"; S.step = 5; render(); window.scrollTo(0, 0); },
  new: () => { S.rec = newRec(); reproject(); S.step = 0; S.phase = "chars"; S.view = "wizard"; S.allSkills = false; save(); render(); window.scrollTo(0, 0); },
  sample: () => {
    patch({ name: "Ada Kowalski (sample)", pronouns: "she/her", age: 48 });
    roll({ ceremony: "characteristics" }); roll({ ceremony: "edu_checks" }); roll({ ceremony: "luck" });
    const best = api({ op: "careers", characteristics: D().characteristics }).ok.find(c => !c.choiceSlots.length);
    patch({ careerId: best.id, hobbyIds: ["occult-curiosity", "people-watching", "poker-nights", "bookworm"] });
    S.phase = "luck"; goStep(5);
  },
};
function toast2(msg) { const t = $("#toast"); t.textContent = msg; t.style.borderColor = "var(--accent)"; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; t.style.borderColor = ""; }, 2500); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el);
});
let typing;
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "name" || id === "pronouns") {
    clearTimeout(typing);
    const v = e.target.value;
    typing = setTimeout(() => { patch({ [id]: v }); renderTop(); renderBar(); }, 250);
    if (id === "name") { const ini = $("#initials"); if (ini) ini.textContent = (v || "?").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase() || "?"; }
    if (id === "name") { const nb = document.querySelector('[data-act="next"]'); if (nb) nb.disabled = !v.trim(); }
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "age") { const v = intVal("age"); if (v !== null && patch({ age: v })) render(); }
});

/* ---------- boot ---------- */
(async function boot() {
  try {
    const bin = Uint8Array.from(atob(WASM_B64), c => c.charCodeAt(0));
    const { instance } = await WebAssembly.instantiate(bin, {});
    wasm = instance.exports;
    const saved = load(KEY_DRAFT, null);
    if (saved && saved.rec && saved.rec.status === "draft") { S.rec = saved.rec; S.step = saved.step || 0; S.phase = saved.phase || "chars"; }
    else S.rec = newRec();
    reproject(); render();
  } catch (err) {
    $("#main").innerHTML = `<div class="boot"><h3>The rules engine didn't load.</h3><p>${esc(err && err.message)}</p></div>`;
  }
})();
</script>
